name: Headless simulation checks
on:
  push:
    branches: [main, "milestones/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run validate
      - run: npm run demo
      - run: npm run ai-demo
      - run: npm run syntax-check
      - run: npm run full-data-demo
      - run: npm run spatial-demo
